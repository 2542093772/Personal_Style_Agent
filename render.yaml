services:
  - type: web
    name: personal-style-agent-bot
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements-cloud.txt
    startCommand: gunicorn telegram_bot.webhook_app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: CLOUD_ADMIN_SECRET
        generateValue: true
      - key: ORCHESTRATOR_SECRET
        generateValue: true
      - key: GITHUB_ORCHESTRATOR_TOKEN
        sync: false
