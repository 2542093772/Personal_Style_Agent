name: Personal Style Learning

on:
  workflow_dispatch:
    inputs:
      job:
        description: "Job to run"
        required: true
        default: "daily"
        type: choice
        options:
          - daily
          - daily-briefing
          - weekly
          - monthly

  schedule:
    # Asia/Shanghai 01:30 = UTC 17:30 previous day: overnight internet learning
    - cron: "30 17 * * *"
    # Asia/Shanghai 07:45 = UTC 23:45 previous day: build and push morning report
    - cron: "45 23 * * *"
    # Sunday 20:30 Asia/Shanghai = Sunday 12:30 UTC
    - cron: "30 12 * * 0"
    # 1st day 21:00 Asia/Shanghai = 13:00 UTC
    - cron: "0 13 1 * *"

permissions:
  contents: write

jobs:
  daily:
    timeout-minutes: 50
    env:
      DAILY_LEARNING_MINUTES: "30"
      DAILY_LEARNING_ROUND_INTERVAL_SECONDS: "240"
    if: github.event_name == 'workflow_dispatch' && inputs.job == 'daily' || github.event_name == 'schedule' && github.event.schedule == '30 17 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scheduler/jobs.py daily
      - name: Commit daily learning output
        run: |
          git config user.name "personal-style-agent"
          git config user.email "actions@users.noreply.github.com"
          git add reports knowledge research personal
          git diff --cached --quiet || git commit -m "chore: daily style learning"
          git push

  daily-briefing:
    if: github.event_name == 'workflow_dispatch' && inputs.job == 'daily-briefing' || github.event_name == 'schedule' && github.event.schedule == '45 23 * * *'
    runs-on: ubuntu-latest
    env:
      LIFE_ASSISTANT_WEBHOOK_URL: ${{ secrets.LIFE_ASSISTANT_WEBHOOK_URL }}
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
      WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scheduler/jobs.py daily-briefing
      - name: Commit daily life plan
        run: |
          git config user.name "personal-style-agent"
          git config user.email "actions@users.noreply.github.com"
          git add reports
          git diff --cached --quiet || git commit -m "chore: daily life briefing"
          git push

  weekly:
    if: github.event_name == 'workflow_dispatch' && inputs.job == 'weekly' || github.event_name == 'schedule' && github.event.schedule == '30 12 * * 0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scheduler/jobs.py weekly
      - name: Commit weekly review
        run: |
          git config user.name "personal-style-agent"
          git config user.email "actions@users.noreply.github.com"
          git add reports knowledge research personal
          git diff --cached --quiet || git commit -m "chore: weekly style review"
          git push

  monthly:
    if: github.event_name == 'workflow_dispatch' && inputs.job == 'monthly' || github.event_name == 'schedule' && github.event.schedule == '0 13 1 * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scheduler/jobs.py monthly
      - name: Commit monthly personal review
        run: |
          git config user.name "personal-style-agent"
          git config user.email "actions@users.noreply.github.com"
          git add reports knowledge research personal data
          git diff --cached --quiet || git commit -m "chore: monthly personal style review"
          git push
